name: Deploy dokarkivavlevering [dev-fss]
on:
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'
      periodeStart:
        description: 'Periode start (f.o.m) for avlevering. YYYY-MM-DD'
        required: true
      periodeSlutt:
        description: 'Periode slutt (t.o.m) for avlevering. YYYY-MM-DD'
        required: true

env:
  IMAGE: docker.pkg.github.com/${{ github.repository }}/dokarkivavlevering:${{ github.sha }}

jobs:
  build:
    name: Checkout code and build docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v1
      - uses: actions/setup-java@v1
        with:
          java-version: '11.x'
      - name: Cache Maven packages
        uses: actions/cache@v1
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-
      - name: Build and run tests
        run: mvn -B package --file pom.xml
      - name: Build Docker image
        run: docker build . --pull --tag ${IMAGE}
      - name: Push Docker image
        run: |
          docker login --username "$GITHUB_REPOSITORY" -p ${{ secrets.GITHUB_TOKEN }} https://docker.pkg.github.com
          docker push ${IMAGE}
  deploy:
    name: Deploy job to dev
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1
      - name: Deploy job to NAIS dev-fss
        uses: nais/deploy/actions/deploy@v1
        env:
          PRINT_PAYLOAD: true
          APIKEY: ${{ secrets.NAIS_DEPLOY_APIKEY }}
          CLUSTER: prod-fss
          RESOURCE: nais/naiserator.yaml
          VAR: periodestart=${{github.event.inputs.periodeStart}},periodeslutt=${{github.event.inputs.periodeSlutt}}
          VARS: nais/prod-config.json