name: Produser avleveringspakke [prod-fss]
on:
  workflow_dispatch:
    inputs:
      periodeStart:
        description: 'Periode start (f.o.m) for avlevering. YYYY-MM-DD'
        required: true
      periodeSlutt:
        description: 'Periode slutt (t.o.m) for avlevering. YYYY-MM-DD'
        required: true
      tema:
        description: 'Tema for avlevering'
        required: true

jobs:
  build:
    name: Build image
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: navikt/dok-workflows/.github/workflows/build-app-gar.yml@main
    secrets: inherit
    with:
      java-version: '25'

  deploy:
    name: Deploy job to prod
    needs: build
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - name: Deploy job to NAIS prod-fss
        uses: nais/deploy/actions/deploy@v2
        env:
          PRINT_PAYLOAD: true
          CLUSTER: prod-fss
          RESOURCE: nais/naiserator.yaml
          VAR: image=${{needs.build.outputs.image}},profile=genererAvlevering,periodestart=${{github.event.inputs.periodeStart}},periodeslutt=${{github.event.inputs.periodeSlutt}},tema=${{github.event.inputs.tema}}
          VARS: nais/prod-config.json
          WAIT: true
          TIMEOUT: 3h
