apiVersion: nais.io/v1
kind: Naisjob
metadata:
  name: dokarkivavlevering
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
  annotations:
    nais.io/read-only-file-system: "false"
spec:
  ttlSecondsAfterFinished: 100
  image: {{image}}
  resources:
    requests:
      memory: "1024Mi"
      cpu: "100m"
    limits:
      memory: "8192Mi"
      cpu: "4000m"
  env:
    - name: SPRING_LDAP_URLS
      value: "{{SPRING_LDAP_URLS}}"
    - name: DOKARKIVAVLEVERING_ENDPOINTS_PDL_URL
      value: "{{DOKARKIVAVLEVERING_ENDPOINTS_PDL_URL}}"
    - name: DOKARKIVAVLEVERING_ENDPOINTS_PDL_SCOPE
      value: "{{DOKARKIVAVLEVERING_ENDPOINTS_PDL_SCOPE}}"
    - name: DOKARKIVAVLEVERING_EREGURL
      value: "{{EREG_URL}}"
    - name: DOKARKIVAVLEVERING_ACTIVEDIRECTORY_BASEDN
      value: "{{AD_NAVUSER_BASEDN}}"
    - name: DOKARKIVAVLEVERING_PERIODE_STARTDATO
      value: "{{periodestart}}"
    - name: DOKARKIVAVLEVERING_PERIODE_SLUTTDATO
      value: "{{periodeslutt}}"
    - name: DOKARKIVAVLEVERING_TEMA
      value: "{{tema}}"
    - name: DOKARKIVAVLEVERING_JOBTYPE
      value: "{{jobb}}"
  webproxy: true
  azure:
    application:
      enabled: true
  vault:
    enabled: true
    paths:
      - kvPath: {{ SRV_LINUX }}
        mountPath: "/var/run/secrets/nais.io/ldap"
      - kvPath: {{ DOKARKIVAVLEVERING_DS_CREDS }}
        mountPath: "/var/run/secrets/nais.io/db_creds"
      - kvPath: {{ DOKARKIVAVLEVERING_DS_CONFIG }}
        mountPath: "/var/run/secrets/nais.io/db_config"