apiVersion: batch/v1
kind: Job
metadata:
  name: dokarkavleverjob
  namespace: teamdokumenthandtering
  labels:
    team: teamdokumenthandtering
spec:
  ttlSecondsAfterFinished: 100
  backoffLimit: 1
  template:
    spec:
      imagePullSecrets:
        - name: gpr-credentials
      serviceAccountName: default
      restartPolicy: Never

      containers:
        - name: dokarkavleverjob
          image: {{image}}
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1024Mi
              cpu: 1000m
          volumeMounts:
            - mountPath: /var/run/secrets/nais.io/vault
              name: vault-secrets
              subPath: vault/var/run/secrets/nais.io/vault
          env:
            - name: VAULT_TOKEN_PATH
              value: /var/run/secrets/nais.io/vault/vault_token
            - name: NAV_TRUSTSTORE_PATH
              value: /etc/ssl/certs/java/cacerts
            - name: NAV_TRUSTSTORE_PASSWORD
              value: changeme
            - name: STARTDATO
              value: "{{startdato}}"
            - name: SLUTTDATO
              value: "{{sluttdato}}"
      initContainers:
        - name: vault-init
          image: navikt/vault-sidekick:v0.3.10-d122b16
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "1000m"
          volumeMounts:
            - mountPath: /var/run/secrets/nais.io/vault
              name: vault-secrets
              subPath: vault/var/run/secrets/nais.io/vault
          args:
            - -v=10
            - -logtostderr
            - -vault=https://vault.adeo.no
            - -one-shot
            - -save-token=/var/run/secrets/nais.io/vault/vault_token
            - -cn=secret:{{VAULT_KV_PATH}}:dir=/var/run/secrets/nais.io/vault,fmt=flatten,retries=1
          env:
            - name: VAULT_AUTH_METHOD
              value: kubernetes
            - name: VAULT_SIDEKICK_ROLE
              value: teamdokumenthandtering
            - name: VAULT_K8S_LOGIN_PATH
              value: auth/kubernetes/preprod/fss/login
      volumes:
        - name: vault-secrets
          emptyDir:
            medium: Memory